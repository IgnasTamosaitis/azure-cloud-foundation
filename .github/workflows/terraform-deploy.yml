name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-dev-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      plan_hash: ${{ steps.checksum.outputs.sha256 }}

    permissions:
      contents: read
      id-token: write

    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_CLI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Azure Login (Reader)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Calculate plan checksum
        id: checksum
        run: echo "sha256=$(sha256sum tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Store plan in Azure Blob
        run: |
          az storage blob upload \
            --account-name sttfignas936686 \
            --container-name tfstate \
            --name "plans/${{ github.run_id }}-${{ github.run_attempt }}.tfplan" \
            --file tfplan \
            --auth-mode login \
            --overwrite true \
            --only-show-errors

  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_CLI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Azure Login (Deploy)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Download approved plan
        run: |
          az storage blob download \
            --account-name sttfignas936686 \
            --container-name tfstate \
            --name "plans/${{ github.run_id }}-${{ github.run_attempt }}.tfplan" \
            --file tfplan \
            --auth-mode login \
            --only-show-errors

      - name: Verify plan integrity
        env:
          EXPECTED_SHA256: ${{ needs.plan.outputs.plan_hash }}
        run: echo "$EXPECTED_SHA256  tfplan" | sha256sum -c -

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Clean up stored plan
        if: always()
        continue-on-error: true
        run: |
          az storage blob delete \
            --account-name sttfignas936686 \
            --container-name tfstate \
            --name "plans/${{ github.run_id }}-${{ github.run_attempt }}.tfplan" \
            --auth-mode login \
            --only-show-errors
